# eSimMate Tool & Dependency Configuration Database
# Defines detection rules, version compatibility matrices, package manager identifiers,
# supported platforms, and default search paths for all eSim 2.5 external tools.

tools:
  kicad:
    name: "KiCad EDA"
    category: "schematic_pcb"
    mandatory: true
    purpose: "Schematic capture, library management, footprint assignment, and PCB layout"
    supported_platforms:
      - "Linux"
      - "Windows"
    executables:
      linux: "kicad"
      windows: "kicad.exe"
    version_check:
      command: ["kicad", "--version"]
      regex: 'KiCad\s+v?(\d+\.\d+\.\d+)'
      timeout_seconds: 5
    compatibility:
      min_version: "6.0.0"
      recommended_version: "7.0.10"
      max_version: "8.0.99"
    package_managers:
      apt: "kicad"
      winget: "KiCad.KiCad"
      choco: "kicad"
    default_search_paths:
      linux:
        - "/usr/bin/kicad"
        - "/usr/local/bin/kicad"
      windows:
        - "C:\\Program Files\\KiCad\\8.0\\bin\\kicad.exe"
        - "C:\\Program Files\\KiCad\\7.0\\bin\\kicad.exe"
        - "C:\\Program Files\\KiCad\\6.0\\bin\\kicad.exe"
    environment_variables:
      - "KICAD_SYMBOL_DIR"
    optional_config:
      library_path_var: "KICAD_SYMBOL_DIR"

  ngspice:
    name: "Ngspice Circuit Simulator"
    category: "simulation"
    mandatory: true
    purpose: "Analog, digital, and mixed-signal SPICE circuit simulation engine"
    supported_platforms:
      - "Linux"
      - "Windows"
    executables:
      linux: "ngspice"
      windows: "ngspice_con.exe"
    executable_candidates:
      linux:
        - "ngspice"
      windows:
        - "ngspice_con.exe"
        - "ngspice.exe"
    version_check:
      command: ["ngspice_con.exe", "-v"]
      regex: 'ngspice[- ](\d+(?:\.\d+)*)'
      mode: "standard"
      timeout_seconds: 5
    compatibility:
      min_version: "34"
      recommended_version: "38"
      max_version: "46"
    package_managers:
      apt: "ngspice"
      winget: "Ngspice.Ngspice"
      choco: "ngspice"
      manual_download: "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/46/ngspice-46_64.7z/download"
    default_search_paths:
      linux:
        - "/usr/bin/ngspice"
        - "/usr/local/bin/ngspice"
      windows:
        - "%LOCALAPPDATA%\\eSimMate\\tools\\ngspice\\Spice64\\bin\\ngspice_con.exe"
        - "%LOCALAPPDATA%\\eSimMate\\tools\\ngspice\\bin\\ngspice_con.exe"
        - "%LOCALAPPDATA%\\eSimMate\\tools\\ngspice\\ngspice-46\\bin\\ngspice_con.exe"
        - "C:\\FOSSEE\\eSim\\Ngspice\\bin\\ngspice_con.exe"
        - "C:\\Program Files\\Ngspice\\bin\\ngspice_con.exe"
        - "%LOCALAPPDATA%\\eSimMate\\tools\\ngspice\\Spice64\\bin\\ngspice.exe"
        - "%LOCALAPPDATA%\\eSimMate\\tools\\ngspice\\bin\\ngspice.exe"
        - "%LOCALAPPDATA%\\eSimMate\\tools\\ngspice\\ngspice-46\\bin\\ngspice.exe"
        - "C:\\FOSSEE\\eSim\\Ngspice\\bin\\ngspice.exe"
        - "C:\\Program Files\\Ngspice\\bin\\ngspice.exe"
    environment_variables: []
    optional_config:
      official_download_url: "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/46/ngspice-46_64.7z/download"
      official_source_name: "SourceForge Official Release (ngspice-46_64.7z)"
      archive_filename: "ngspice-46_64.7z"
      official_version: "46"

  ghdl:
    name: "GHDL VHDL Simulator"
    category: "hdl_vhdl"
    mandatory: false
    purpose: "VHDL analyzer and simulator for NGHDL digital co-simulation"
    supported_platforms:
      - "Linux"
      - "Windows"
    executables:
      linux: "ghdl"
      windows: "ghdl.exe"
    version_check:
      command: ["ghdl", "--version"]
      regex: 'GHDL\s+(\d+\.\d+\.\d+)'
      timeout_seconds: 5
    compatibility:
      min_version: "2.0.0"
      recommended_version: "3.0.0"
      max_version: "4.1.0"
    package_managers:
      apt: "ghdl"
      winget: ""
      choco: "ghdl"
    default_search_paths:
      linux:
        - "/usr/bin/ghdl"
        - "/usr/local/bin/ghdl"
      windows:
        - "C:\\ghdl-mcode\\bin\\ghdl.exe"
        - "C:\\Program Files\\ghdl\\bin\\ghdl.exe"
    environment_variables: []
    optional_config:
      backend: "mcode"

  openmodelica:
    name: "OpenModelica Compiler (omc)"
    category: "modeling"
    mandatory: false
    purpose: "System-level physical equation modeling and simulation"
    supported_platforms:
      - "Linux"
      - "Windows"
    executables:
      linux: "omc"
      windows: "omc.exe"
    version_check:
      command: ["omc", "--version"]
      regex: 'OpenModelica\s+v?(\d+\.\d+\.\d+)'
      timeout_seconds: 5
    compatibility:
      min_version: "1.19.0"
      recommended_version: "1.21.0"
      max_version: "1.22.99"
    package_managers:
      apt: "openmodelica"
      winget: "OpenModelica.OpenModelica"
      choco: ""
    default_search_paths:
      linux:
        - "/usr/bin/omc"
        - "/usr/local/bin/omc"
      windows:
        - "C:\\Program Files\\OpenModelica1.21.0-64bit\\bin\\omc.exe"
        - "C:\\Program Files\\OpenModelica1.19.0-64bit\\bin\\omc.exe"
    environment_variables:
      - "OPENMODELICAHOME"
    optional_config: {}

  verilator:
    name: "Verilator"
    category: "hdl_verilog"
    mandatory: false
    purpose: "Verilog and SystemVerilog simulator for digital co-simulation"
    supported_platforms:
      - "Linux"
      - "Windows"
    executables:
      linux: "verilator"
      windows: "verilator.exe"
    version_check:
      command: ["verilator", "--version"]
      regex: 'Verilator\s+(\d+\.\d+)'
      timeout_seconds: 5
    compatibility:
      min_version: "4.200"
      recommended_version: "5.008"
      max_version: "5.999"
    package_managers:
      apt: "verilator"
      winget: ""
      choco: ""
    default_search_paths:
      linux:
        - "/usr/bin/verilator"
        - "/usr/local/bin/verilator"
      windows:
        - "C:\\msys64\\mingw64\\bin\\verilator.exe"
    environment_variables: []
    optional_config: {}

  freecad:
    name: "FreeCAD 3D Modeler"
    category: "3d_cad"
    mandatory: false
    purpose: "3D CAD modeling and PCB 3D footprint visualization"
    supported_platforms:
      - "Linux"
      - "Windows"
    executables:
      linux: "freecad"
      windows: "FreeCAD.exe"
    version_check:
      command: ["freecad", "--version"]
      regex: 'FreeCAD\s+v?(\d+\.\d+)'
      timeout_seconds: 5
    compatibility:
      min_version: "0.19.0"
      recommended_version: "0.21.2"
      max_version: "1.0.0"
    package_managers:
      apt: "freecad"
      winget: "FreeCAD.FreeCAD"
      choco: "freecad"
    default_search_paths:
      linux:
        - "/usr/bin/freecad"
        - "/usr/local/bin/freecad"
      windows:
        - "C:\\Program Files\\FreeCAD 0.21\\bin\\FreeCAD.exe"
        - "C:\\Program Files\\FreeCAD 0.20\\bin\\FreeCAD.exe"
    environment_variables: []
    optional_config: {}

  python:
    name: "Python 3 Runtime"
    category: "runtime"
    mandatory: true
    purpose: "Underlying programming language environment executing eSim"
    supported_platforms:
      - "Linux"
      - "Windows"
    executables:
      linux: "python3"
      windows: "python.exe"
    version_check:
      command: ["python3", "--version"]
      regex: 'Python\s+(\d+\.\d+\.\d+)'
      timeout_seconds: 5
    compatibility:
      min_version: "3.10.0"
      recommended_version: "3.11.5"
      max_version: "3.12.99"
    package_managers:
      apt: "python3"
      winget: "Python.Python.3.11"
      choco: "python"
    default_search_paths:
      linux:
        - "/usr/bin/python3"
      windows:
        - "C:\\Python311\\python.exe"
        - "C:\\Program Files\\Python311\\python.exe"
    environment_variables: []
    optional_config: {}
